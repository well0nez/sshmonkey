name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test
        run: go test ./... -v -count=1

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o sshmonkey ./cmd/sshmonkey

      - name: Verify binary
        run: |
          file sshmonkey
          ./sshmonkey version
